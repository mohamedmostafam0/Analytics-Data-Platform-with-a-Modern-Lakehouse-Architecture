{{- if .Values.features.sourcePostgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lakehouse-platform.postgresqlBootstrapName" . }}
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "lakehouse-platform.baseLabels" . | nindent 4 }}
    app.kubernetes.io/component: "source-postgresql"
data:
  01-items.sql: |
    CREATE TABLE IF NOT EXISTS public.items (
      id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      name TEXT NOT NULL,
      category TEXT NOT NULL,
      price NUMERIC(10, 2) NOT NULL CHECK (price >= 0),
      inventory INTEGER NOT NULL CHECK (inventory >= 0),
      created_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP
    );
    ALTER TABLE public.items OWNER TO {{ .Values.components.sourcePostgresql.owner }};
{{- end }}
