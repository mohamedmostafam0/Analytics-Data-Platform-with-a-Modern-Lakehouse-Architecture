{{- if .Values.features.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lakehouse-platform.mainPostgresqlBootstrapName" . }}
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "lakehouse-platform.postgresqlLabels" . | nindent 4 }}
data:
  01-main.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;

    DO $readonly$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'readonly') THEN
        CREATE ROLE readonly NOLOGIN;
      END IF;
    END
    $readonly$;

    CREATE TABLE IF NOT EXISTS public.users (
      id SERIAL PRIMARY KEY,
      first_name VARCHAR(100),
      last_name VARCHAR(100),
      email VARCHAR(255),
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS public.items (
      id SERIAL PRIMARY KEY,
      name VARCHAR(255) NOT NULL,
      category VARCHAR(100),
      price DECIMAL(10, 2),
      inventory INTEGER,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS public.purchases (
      id SERIAL PRIMARY KEY,
      user_id BIGINT REFERENCES public.users(id),
      item_id BIGINT REFERENCES public.items(id),
      campaign_id VARCHAR(50),
      status SMALLINT DEFAULT 1,
      quantity INTEGER DEFAULT 1,
      purchase_price DECIMAL(12, 2),
      deleted BOOLEAN DEFAULT FALSE,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS public.reviews (
      review_id SERIAL PRIMARY KEY,
      customer_name VARCHAR(255),
      customer_email VARCHAR(255),
      date DATE,
      review TEXT,
      review_embedding vector(384)
    );

    ALTER TABLE public.users OWNER TO {{ .Values.components.postgresql.owner }};
    ALTER TABLE public.items OWNER TO {{ .Values.components.postgresql.owner }};
    ALTER TABLE public.purchases OWNER TO {{ .Values.components.postgresql.owner }};
    ALTER TABLE public.reviews OWNER TO {{ .Values.components.postgresql.owner }};
    ALTER SEQUENCE public.users_id_seq OWNER TO {{ .Values.components.postgresql.owner }};
    ALTER SEQUENCE public.items_id_seq OWNER TO {{ .Values.components.postgresql.owner }};
    ALTER SEQUENCE public.purchases_id_seq OWNER TO {{ .Values.components.postgresql.owner }};
    ALTER SEQUENCE public.reviews_review_id_seq OWNER TO {{ .Values.components.postgresql.owner }};

    GRANT CONNECT ON DATABASE {{ .Values.components.postgresql.database }} TO readonly;
    GRANT USAGE ON SCHEMA public TO readonly;
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO readonly;
    ALTER DEFAULT PRIVILEGES FOR ROLE {{ .Values.components.postgresql.owner }}
      IN SCHEMA public GRANT SELECT ON TABLES TO readonly;

    INSERT INTO public.reviews (customer_name, customer_email, date, review)
    SELECT fixture.customer_name, fixture.customer_email, fixture.review_date, fixture.review
    FROM (VALUES
      ('Alice Smith', 'alice.smith@email.com', DATE '2024-03-08', 'Amazing customer service! They went above and beyond to help me with my order. I will definitely be back.'),
      ('Bob Johnson', 'bob.johnson@email.com', DATE '2024-03-07', 'Fast and efficient support. My question was answered quickly and the issue was resolved immediately.'),
      ('Charlie Brown', 'charlie.brown@email.com', DATE '2024-03-06', 'Helpful and friendly staff. They were patient and understanding when I was having trouble navigating the website.'),
      ('David Garcia', 'david.garcia@email.com', DATE '2024-03-05', 'Excellent communication! I received prompt updates on my order status and delivery time. I am really happy.'),
      ('Eve Williams', 'eve.williams@email.com', DATE '2024-03-04', 'Very impressed with the customer service! They were quick to address my concerns and offered a satisfactory solution.'),
      ('Finn Miller', 'finn.miller@email.com', DATE '2024-03-03', 'Positive experience dealing with customer support. They were knowledgeable and able to assist me with my product inquiry efficiently.'),
      ('Grace Davis', 'grace.davis@email.com', DATE '2024-03-02', 'My query was acknowledged, and I received a response. The answer was okay, but I am still unsure about the overall experience.'),
      ('Harry Rodriguez', 'harry.rodriguez@email.com', DATE '2024-03-01', 'Terrible customer service! I waited for hours for a reply to a question, and no one replied yet.'),
      ('Ivy Wilson', 'ivy.wilson@email.com', DATE '2024-02-29', 'Extremely unhelpful and rude support staff. They were dismissive of my issue and offered no real assistance.'),
      ('Jack Moore', 'jack.moore@email.com', DATE '2024-02-28', 'Disappointing customer service experience. I had to contact them multiple times to get a simple issue resolved, and they keep redirecting me.'),
      ('Lucas Bennett', 'lucas.bennett@email.com', DATE '2024-03-02', 'Awful experience! The support team completely ignored my request for help, and I had to figure everything out on my own.'),
      ('Sophia Turner', 'sophia.turner@email.com', DATE '2024-03-01', 'Horrible service. I was given misleading information that caused even more issues, and no one took responsibility for it.'),
      ('Ethan Brooks', 'ethan.brooks@email.com', DATE '2024-02-29', 'Frustrating support process. I kept getting automated responses with no real solution, and it took days to get a proper answer.')
    ) AS fixture(customer_name, customer_email, review_date, review)
    WHERE NOT EXISTS (SELECT 1 FROM public.reviews);
{{- end }}
