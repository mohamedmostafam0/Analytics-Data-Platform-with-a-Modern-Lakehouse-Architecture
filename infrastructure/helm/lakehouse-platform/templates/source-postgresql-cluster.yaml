{{- if .Values.features.sourcePostgresql.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.components.sourcePostgresql.clusterName | quote }}
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "lakehouse-platform.baseLabels" . | nindent 4 }}
    app.kubernetes.io/component: "source-postgresql"
spec:
  instances: {{ .Values.components.sourcePostgresql.instances }}
  imageName: {{ .Values.components.sourcePostgresql.imageName | quote }}
  imagePullPolicy: {{ .Values.components.sourcePostgresql.imagePullPolicy }}
  enableSuperuserAccess: false
  enablePDB: false
  inheritedMetadata:
    labels:
      app.kubernetes.io/name: {{ include "lakehouse-platform.name" . | quote }}
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: "source-postgresql"
      app.kubernetes.io/part-of: "lakehouse-platform"
  bootstrap:
    initdb:
      database: {{ .Values.components.sourcePostgresql.database | quote }}
      owner: {{ .Values.components.sourcePostgresql.owner | quote }}
      secret:
        name: {{ .Values.components.sourcePostgresql.credentialsSecret.name | quote }}
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: {{ include "lakehouse-platform.postgresqlBootstrapName" . }}
            key: 01-items.sql
  storage:
    size: {{ .Values.components.sourcePostgresql.storage.size | quote }}
    {{- with .Values.components.sourcePostgresql.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  resources:
    {{- toYaml .Values.components.sourcePostgresql.resources | nindent 4 }}
{{- end }}
