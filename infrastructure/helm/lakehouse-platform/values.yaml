global:
  environment: local
  profile: minimal
  sourceRepository: https://github.com/mohamedmostafam0/Analytics-Data-Platform-with-a-Modern-Lakehouse-Architecture
  gitCommit: ""

namespace:
  create: true
  name: lakehouse-platform
  labels: {}
  annotations: {}

# The base values remain foundation-only. The explicit minimal overlay enables the
# approved Phase 2 source PostgreSQL and item-seeding Job.
features:
  postgresql:
    enabled: false
  sourcePostgresql:
    enabled: false
  cdcPostgresql:
    enabled: false
  itemsLoadGenerator:
    enabled: false
  systemLoadGenerator:
    enabled: false
  flashSaleLoadGenerator:
    enabled: false
  minio:
    enabled: false
  minioClient:
    enabled: false
  icebergRest:
    enabled: false
  spark:
    enabled: false
  trino:
    enabled: false
  kafka:
    enabled: false
  kafkaSetup:
    enabled: false
  schemaRegistry:
    enabled: false
  kafkaConnect:
    enabled: false
  connectorSetup:
    enabled: false
  loginLoadGenerator:
    enabled: false
  redpandaConsole:
    enabled: false
  flink:
    enabled: false
  clickhouse:
    enabled: false
  openSearch:
    enabled: false
  streamlit:
    enabled: false
  superset:
    enabled: false
  airflow:
    enabled: false
  mailhog:
    enabled: false

components:
  postgresql:
    clusterName: platform-postgresql
    operatorNamespace: cnpg-system
    imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:4e4ac3fb2c914cfb44f80f0b8be8aa550e83b80bf5220df49c3a8780c1f79bc8
    imagePullPolicy: IfNotPresent
    instances: 1
    database: oneshop
    owner: platform_app
    credentialsSecret:
      name: ""
      usernameKey: username
      passwordKey: password
    storage:
      size: 2Gi
      storageClass: ""
    resources:
      requests:
        cpu: 150m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 1536Mi
  sourcePostgresql:
    clusterName: items-postgresql
    operatorNamespace: cnpg-system
    imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie@sha256:9287ce030c6f3ce822e383b019ae4aaf1e8370bff3b39f9c51dc10d69dc97219
    imagePullPolicy: IfNotPresent
    instances: 1
    database: oneshop
    owner: items_app
    credentialsSecret:
      name: ""
      usernameKey: username
      passwordKey: password
    storage:
      size: 1Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  itemsLoadGenerator:
    image:
      repository: lakehouse/items-loadgen
      tag: phase2-0.1.0
      digest: ""
      pullPolicy: Never
    itemCount: 100
    seedMode: skip-if-present
    backoffLimit: 2
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 900
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
  minio:
    image:
      repository: lakehouse/minio
      tag: phase3a-RELEASE.2025-10-15T17-29-55Z
      digest: ""
      pullPolicy: Never
    credentialsSecret:
      name: ""
      usernameKey: rootUser
      passwordKey: rootPassword
    apiPort: 9000
    consolePort: 9001
    storage:
      size: 2Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 750m
        memory: 768Mi
  minioClient:
    image:
      repository: lakehouse/minio-client
      tag: phase3a-RELEASE.2025-08-13T08-35-41Z
      digest: ""
      pullPolicy: Never
    buckets:
      - warehouse
      - pageviews
      - postgres-backups
    persistenceMarker:
      bucket: warehouse
      object: .phase3a/persistence-marker.txt
    backoffLimit: 4
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 1800
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
